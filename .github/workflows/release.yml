name: Release

# ship.method nested: this workflow lives in the public addon repo, which holds no tests.
# The full LuaJIT suite runs in the private project before the tag (skill release).
# Packaging rules live in .pkgmeta. A tag uploads to CurseForge (CF_API_KEY, the toc's
# X-Curse-Project-ID) and to a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: PinnoTweaks-zip
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
